# custom_botsort.yaml

tracker_type: botsort
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 150
match_thresh: 0.95
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.25      # Must be included even with ReID off
with_reid: false         
fuse_score: true
model: auto
